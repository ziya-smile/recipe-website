services:
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - ./:/app
    environment:
      - RECIPE_DATA_DIR=/app/backend/data
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - PYTHONUNBUFFERED=1
    env_file:
      - /run/base44/app.env
    command: sh -c "pip install --quiet -r requirements.txt && python -m uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: node:22
    working_dir: /app/frontend
    volumes:
      - ./:/app
    ports:
      - "3000:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    depends_on:
      backend:
        condition: service_healthy
